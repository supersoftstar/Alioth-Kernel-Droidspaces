on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone Asia/Shanghai || true
      - name: Add swap
        run: |
          sudo fallocate -l 5G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
      - name: Install build deps
        run: |
          sudo apt-get update && sudo apt-get install -y git automake build-essential bc
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1
      - name: Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2
      - name: Submodules
        run: |
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard
      - name: Remove KSU
        run: |
          rm -rf drivers/kernelsu
          sed -i '/source.*kernelsu\/Kconfig/d' drivers/Kconfig || true
          sed -i '/obj.*kernelsu/d' drivers/Makefile || true
      - name: Verify configs
        run: |
          for cfg in CONFIG_PID_NS CONFIG_DEVTMPFS CONFIG_NET_NS; do
            grep -q "^${cfg}=y" arch/arm64/configs/alioth_kosminor_defconfig && echo "OK $cfg"
          done
          sed -i '/^CONFIG_KSU/d' arch/arm64/configs/alioth_kosminor_defconfig || true
          cat >> arch/arm64/configs/alioth_kosminor_defconfig <<EOF
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
EOF
      - name: Build
        run: |
          export LOCALVERSION="-g92c089fc2d37-apatch"
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out alioth_kosminor_defconfig
          make -j$(nproc --all) O=out 2>&1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Apatch_Droidspaces
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
