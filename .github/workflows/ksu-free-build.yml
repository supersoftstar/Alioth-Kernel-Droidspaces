on:
  workflow_dispatch:

jobs:
  build:
    name: Build Alioth (no KSU)
    runs-on: ubuntu-24.04
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone Asia/Shanghai || true
          echo "TZ set"

      - name: Add swap
        run: |
          sudo fallocate -l 5G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git automake build-essential bc

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      - name: Get Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2

      - name: Processing submodules (NO KSU)
        run: |
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard

      - name: Remove KernelSU integration
        run: |
          rm -rf drivers/kernelsu
          sed -i '/source.*kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/obj.*kernelsu/d' drivers/Makefile
          if grep -ri "kernelsu" drivers/Kconfig drivers/Makefile; then
            echo "KSU references still present"
            exit 1
          fi
          echo "OK no KSU references"

      - name: Verify Droidspaces configs
        run: |
          for cfg in CONFIG_PID_NS=y CONFIG_DEVTMPFS=y CONFIG_CGROUP_DEVICE=y                      CONFIG_OVERLAY_FS=y CONFIG_NET_NS=y CONFIG_VETH=y; do
            if grep -q "$cfg" arch/arm64/configs/alioth_kosminor_defconfig; then
              echo "  OK  $cfg"
            else
              echo "  MISSING  $cfg"
            fi
          done

      - name: Verify APatch configs
        run: |
          for cfg in CONFIG_MODULES=y CONFIG_KPROBES=y CONFIG_HAVE_KPROBES=y                      CONFIG_KRETPROBES=y CONFIG_SECURITY=y; do
            if grep -qE "^${cfg}(=|$)" arch/arm64/configs/alioth_kosminor_defconfig; then
              echo "  OK  $cfg"
            else
              echo "  MISSING  $cfg"
            fi
          done
          if grep -q "^CONFIG_KSU" arch/arm64/configs/alioth_kosminor_defconfig; then
            sed -i '/^CONFIG_KSU/d' arch/arm64/configs/alioth_kosminor_defconfig
            echo "Removed CONFIG_KSU"
          fi

      - name: Add DEVTMPFS
        run: |
          cat >> arch/arm64/configs/alioth_kosminor_defconfig <<EOF

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
EOF

      - name: Build Kernel
        run: |
          export LOCALVERSION="-g92c089fc2d37-apatch"
          export KBUILD_BUILD_HOST=AICloudServer
          export KBUILD_BUILD_USER=VastCore
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_kosminor_defconfig
          if grep -q "CONFIG_KSU=y" out/.config; then
            echo "ERROR: CONFIG_KSU=y found!"
            exit 1
          fi
          for cfg in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_USER_NS CONFIG_NET_NS; do
            grep "^$cfg=" out/.config && echo "  OK  $cfg"
          done
          make -j$(nproc --all) O=out 2>&1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Apatch_Droidspaces
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
