name: Build Alioth (Droidspaces, no KSU)
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Alioth (Droidspaces, no KSU)
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc -y

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      - name: Get Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/VastCore/alioth-python-2.7.18-prebuilt.git --depth=1 toolchain/python2

      - name: Processing submodules (NO KSU)
        run: |
          # NOTE: deliberately NOT pulling KernelSU submodule
          # APatch will load as a kernel module at runtime; it does NOT need to be compiled in.
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard

      - name: Remove KernelSU integration from source tree
        run: |
          # VastCore ships drivers/kernelsu as a symlink to the (now absent) KernelSU submodule.
          # Remove it and its references from Kconfig/Makefile so the build doesn't break.
          echo "=== Removing drivers/kernelsu ==="
          rm -rf drivers/kernelsu
          echo "=== Cleaning Kconfig ==="
          sed -i '/source.*kernelsu\/Kconfig/d' drivers/Kconfig
          echo "=== Cleaning Makefile ==="
          sed -i '/obj.*kernelsu/d' drivers/Makefile
          echo "=== Verify no KSU references remain ==="
          if grep -ri "kernelsu" drivers/Kconfig drivers/Makefile; then
            echo "WARNING: KSU references still present!"
            exit 1
          else
            echo "OK: no KSU references"
          fi

      - name: Verify Droidspaces configs
        run: |
          echo "=== Droidspaces config check ==="
          for cfg in CONFIG_PID_NS=y CONFIG_DEVTMPFS=y CONFIG_CGROUP_DEVICE=y \
                     CONFIG_OVERLAY_FS=y CONFIG_NET_NS=y CONFIG_VETH=y; do
            if grep -q "$cfg" arch/arm64/configs/alioth_kosminor_defconfig; then
              echo "  OK  $cfg"
            else
              echo "  MISSING  $cfg"
            fi
          done

      - name: Verify APatch-compatible configs
        run: |
          echo "=== APatch compatibility check ==="
          # APatch loads ap.ko as a kernel module, so we need:
          for cfg in CONFIG_MODULES=y CONFIG_KPROBES=y CONFIG_HAVE_KPROBES=y \
                     CONFIG_KRETPROBES=y CONFIG_HAVE_KRETPROBES=y CONFIG_SECURITY=y; do
            if grep -qE "^${cfg}(=|$)" arch/arm64/configs/alioth_kosminor_defconfig; then
              echo "  OK  $cfg"
            else
              echo "  MISSING  $cfg (will be set by defconfig if available)"
            fi
          done
          echo "=== Ensure CONFIG_KSU is NOT in defconfig ==="
          if grep -q "^CONFIG_KSU" arch/arm64/configs/alioth_kosminor_defconfig; then
            sed -i '/^CONFIG_KSU/d' arch/arm64/configs/alioth_kosminor_defconfig
            echo "Removed CONFIG_KSU lines from defconfig"
          fi

      - name: Add additional required configs (DEVTMPFS + tmpfs hardening)
        run: |
          cat >> arch/arm64/configs/alioth_kosminor_defconfig <<'EOF'

# Added for APatch + droidspaces compatibility
# DEVTMPFS is recommended by droidspaces 'check' for hardware access mode
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
EOF
          echo "=== Tail of defconfig ==="
          tail -10 arch/arm64/configs/alioth_kosminor_defconfig

      - name: Build Kernel
        run: |
          export LOCALVERSION="-g92c089fc2d37-apatch"
          export KBUILD_BUILD_HOST=AICloudServer
          export KBUILD_BUILD_USER=VastCore
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
          export KBUILD_LINKER_STRING=$(ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_kosminor_defconfig
          echo "=== Verify CONFIG_KSU is NOT in .config ==="
          if grep -q "CONFIG_KSU=y" out/.config; then
            echo "ERROR: CONFIG_KSU=y found in .config!"
            exit 1
          else
            echo "OK: no CONFIG_KSU in .config"
          fi
          echo "=== Verify droidspaces configs in .config ==="
          for cfg in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_USER_NS CONFIG_NET_NS; do
            grep "^$cfg=" out/.config && echo "  OK  $cfg" || echo "  MISSING  $cfg"
          done
          make -j$(nproc --all) O=out 2>&1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alioth_Kernel_Apatch_Droidspaces
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img

# Modified for APatch compatibility (no KSU) by supersoftstar
# Build kernel WITHOUT KernelSU so APatch can load its module without conflict.
# droidspaces namespace patches (PID_NS, IPC_NS, USER_NS) are kept from VastCore.
